# 데모 Alertmanager 설정. https://prometheus.io/docs/alerting/latest/configuration/
route:
  receiver: triagent
  group_by: [alertname, service]
  # 데모에서 결과를 빨리 보기 위해 대기 시간을 짧게 둡니다.
  group_wait: 5s
  group_interval: 30s
  repeat_interval: 1h

receivers:
  - name: triagent
    webhook_configs:
      - url: http://triagent:8080/api/v1/alerts/alertmanager
        # 장애가 해소되면 resolved 알림도 보내, Triagent가 장애를 닫게 합니다.
        send_resolved: true
