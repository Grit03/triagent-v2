spring:
  application:
    name: triagent
  jpa:
    # 트랜잭션 밖(뷰 렌더링 시점)까지 DB 커넥션을 붙잡지 않도록 끕니다.
    # https://docs.spring.io/spring-boot/reference/data/sql.html#data.sql.jpa-and-spring-data.open-entity-manager-in-view
    open-in-view: false

# Actuator: 기본으로 health 엔드포인트만 웹에 노출됩니다.
# https://docs.spring.io/spring-boot/reference/actuator/endpoints.html#actuator.endpoints.exposing
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true # Kubernetes liveness/readiness 프로브용 /actuator/health/{liveness,readiness}
