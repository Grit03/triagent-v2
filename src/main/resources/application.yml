spring:
  application:
    name: triagent
  # SPRING_DATASOURCE_URL(예: jdbc:postgresql://localhost:5432/triagent)을 주면 PostgreSQL을 쓰고,
  # 주지 않으면 Spring Boot가 메모리 DB(H2)를 자동으로 띄웁니다(로컬 실행, 테스트용).
  jpa:
    hibernate:
      # 테이블은 Flyway 마이그레이션(db/migration)이 만들고, Hibernate는 엔티티와 맞는지 검증만 합니다.
      # https://docs.spring.io/spring-boot/how-to/data-initialization.html#howto.data-initialization.migration-tool.flyway
      ddl-auto: validate
    # 트랜잭션 밖(뷰 렌더링 시점)까지 DB 커넥션을 붙잡지 않도록 끕니다.
    # https://docs.spring.io/spring-boot/reference/data/sql.html#data.sql.jpa-and-spring-data.open-entity-manager-in-view
    open-in-view: false
  task:
    # @Async가 사용하는 스레드 풀(applicationTaskExecutor) 설정
    # https://docs.spring.io/spring-boot/reference/features/task-execution-and-scheduling.html
    execution:
      thread-name-prefix: investigation-
      pool:
        core-size: 4
        max-size: 8
        queue-capacity: 100
  http:
    clients:
      # RestClient 공통 타임아웃. 장애 상황에서 느린 외부 API 때문에 조사가 무한정 멈추지 않게 합니다.
      # https://docs.spring.io/spring-boot/reference/io/rest-client.html#io.rest-client.clienthttprequestfactory.configuration
      connect-timeout: 3s
      read-timeout: 10s

triagent:
  notification:
    slack:
      # Slack Incoming Webhook URL. 비워 두면 Slack 보고를 끄고 로그로만 남깁니다.
      webhook-url: ${SLACK_WEBHOOK_URL:}
      # 승인 버튼 요청의 서명을 검증하는 Slack 앱 Signing Secret. 비워 두면 모든 버튼 요청을 거부합니다.
      signing-secret: ${SLACK_SIGNING_SECRET:}
  github:
    base-url: https://api.github.com
    # 공개 저장소는 토큰 없이도 조회되지만, 비인증 요청은 시간당 60회로 제한됩니다.
    token: ${GITHUB_TOKEN:}
    lookback: 24h
    # 장애 알림의 service 라벨 → GitHub 저장소(owner/repo)
    repositories: {}
  loki:
    # Loki 주소. 비워 두면 로그 수집을 끕니다. 예: http://localhost:3100
    base-url: ${LOKI_URL:}
    # %s 자리에 알림의 service 라벨 값이 들어갑니다(LogQL).
    query: '{service="%s"} |~ "(?i)(error|exception)"'
    lookback: 15m
    limit: 20
  prometheus:
    # Prometheus 주소. 비워 두면 지표 수집을 끕니다. 예: http://localhost:9090
    base-url: ${PROMETHEUS_URL:}
    # 장애 직전 기준값을 볼 시점(장애 시작 시각 - lookback)
    lookback: 30m
    # 이름 → PromQL 템플릿. %1$s 자리에 알림의 service 라벨 값이 들어갑니다.
    # 기본값은 Spring Boot Actuator(Micrometer)가 내보내는 http_server_requests 지표 기준입니다.
    queries:
      error-rate: 'sum(rate(http_server_requests_seconds_count{service="%1$s",status=~"5.."}[5m])) / sum(rate(http_server_requests_seconds_count{service="%1$s"}[5m]))'
      p95-latency-seconds: 'histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{service="%1$s"}[5m])))'
  access:
    # 팀별 구성원(Slack 사용자 ID)과 담당 서비스. 담당 팀이 없는 서비스의 조치는 아무도 승인할 수 없습니다.
    # 예: payments: { members: [U012ABCDEF], services: [payment-api] }
    teams: {}
  analysis:
    anthropic:
      # Claude API 키. 비워 두면 LLM 대신 규칙 기반 요약을 사용합니다.
      api-key: ${ANTHROPIC_API_KEY:}
      model: claude-opus-5-5
      max-tokens: 16000
      # 생각의 깊이와 토큰 사용량을 조절합니다(low, medium, high, xhigh, max).
      effort: medium

# Actuator: 기본으로 health 엔드포인트만 웹에 노출됩니다.
# https://docs.spring.io/spring-boot/reference/actuator/endpoints.html#actuator.endpoints.exposing
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true # Kubernetes liveness/readiness 프로브용 /actuator/health/{liveness,readiness}
